<h2>합동 </h2>
<p>내접원을 그려서 내심에서 접점들까지 선분을 그린다.
$I$ 를 중심으로 하고 $A$ 를 지나는 원의 세 반지름 
$IA, IX, IY$ 과 묶어서 보면 합동인 삼각형들을 발견할 수 있다.</p>
<h2>꼭짓점에서 내접원 접점까지 거리 </h2>
<p>앞서 확인한 삼각형의 합동에서
$$\overline{XD} = \overline{DY} = \overline{AF}$$
이다. 이로부터 
$$\overline{XY} = 2 \times \overline{AF} = 30+36-42 =24$$
를 얻는다.</p>
