<h2>내외각의 크기 </h2>
<p>이등변삼각형 $ABC$ 의 두 각의 크기 $\angle B = \angle C = 68^\circ$ 를 확인한다.
이로부터 $\angle C$ 의 외각 크기 $\angle ACE = 112^\circ$ 를 얻는다. 
이 각을 이등분하는 두 각의 크기는 $\angle ACD = \angle DCE = 56^\circ$ 이고 
$$\angle BCD = 68^\circ + 56^\circ = 124^\circ 
    \Longrightarrow  \angle CBD = \angle BDC = 28^\circ$$ 
를 얻는다.</p>
