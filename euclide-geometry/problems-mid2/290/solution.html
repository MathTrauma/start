<h2>외각보기 </h2>
<p>내심이 등장하는 문제에서 흔히 그렇듯이 
$\angle A = 2\alpha$, $\angle B = 2\beta$, $\angle C = 2\gamma = 70$
으로 둔다. 여기서 $\alpha + \beta + \gamma =90^\circ$ 임을 명심하자. 
문제의 $x,y$ 를 삼각형의 외각으로 보면, 
$x = \alpha + 70,\; y = \beta + 70$ 이다. 이를 더하면
$$x+y = \alpha + \beta + 140 = (90 - \gamma) + 140 = 195$$
을 얻는다.</p>
